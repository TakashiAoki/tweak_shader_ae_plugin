name: Test

on: [push]

jobs:
  build_mac:
    # 署名シークレットなしのフォーク用: ad-hoc署名ビルド (公証なし)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (ad-hoc signed)
        run: |
          cargo install just
          just release_unsigned

      - name: Zip plugin bundle
        run: |
          cd target/release
          zip -r StarField.plugin.zip StarField.plugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-universal
          path: target/release/StarField.plugin.zip
          if-no-files-found: error

  build_win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: |
          cargo install just
          just release
      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: target/release/StarField.aex
          if-no-files-found: error
